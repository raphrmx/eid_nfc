name: eid_nfc_example
description: >-
  Reads a passport or an identity card through the phone's NFC, with every
  command logged, to try eid_nfc and eid_icao on real documents.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.5.0
  flutter: '>=3.24.0'

dependencies:
  # The MRZ scanner came with 0.1.2.
  eid_icao: ^0.1.2
  eid_nfc:
    path: ../
  flutter:
    sdk: flutter
  # The camera's frames, for eid_icao's MRZ scanner: onFrame came with 2.3.0.
  universal_barcode_scanner: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^2.8.0

flutter:
  uses-material-design: true
